<title>Dubai Metro Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap">
<style>
/* Layout: full-bleed pannable schematic, floating route panel top-left (top sheet on phones), legend + zoom controls bottom */
:root{
  --bg:#F4F7F8; --surface:#FFFFFF; --fg:#18212A; --muted:#62707C; --rule:#DFE5E9;
  --red:#E1251B; --green:#21A246; --tram:#EE8A00; --mono:#7B4FC4; --mono-ink:#FFFFFF; --water:#CDE5F1; --water-ink:#5E8FAA; --sea:#BEDCEC; --shallow:#D6EBF5; --wave:#B1D5E8; --sand:#EADBB8; --district:#C9D2D8; --outside:#E4E9EC;
  --accent:#1D5FB4; --accent-soft:#E3EDF9; --ok:#21A246; --warn-bg:#FFF1D6; --warn-fg:#7A4B00; --shadow:0 6px 24px rgba(20,35,50,.12),0 1px 3px rgba(20,35,50,.08);
  --font-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Unbounded","Golos Text",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161C; --surface:#18212A; --fg:#E6ECF0; --muted:#94A2AE; --rule:#2A3640;
  --red:#F2473D; --green:#37C063; --tram:#FFA42A; --mono:#B08CF0; --mono-ink:#1A1A1A; --water:#17344A; --water-ink:#6F9DBA; --sea:#0F2738; --shallow:#16344A; --wave:#14304A; --sand:#3B3627; --district:#2A3540; --outside:#0B0F13;
  --accent:#6FA6F0; --accent-soft:#1E3550; --ok:#37C063; --warn-bg:#3A2C10; --warn-fg:#FFD58A; --shadow:0 6px 24px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161C; --surface:#18212A; --fg:#E6ECF0; --muted:#94A2AE; --rule:#2A3640;
  --red:#F2473D; --green:#37C063; --tram:#FFA42A; --mono:#B08CF0; --mono-ink:#1A1A1A; --water:#17344A; --water-ink:#6F9DBA; --sea:#0F2738; --shallow:#16344A; --wave:#14304A; --sand:#3B3627; --district:#2A3540; --outside:#0B0F13;
  --accent:#6FA6F0; --accent-soft:#1E3550; --ok:#37C063; --warn-bg:#3A2C10; --warn-fg:#FFD58A; --shadow:0 6px 24px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;overflow:hidden}
*{box-sizing:border-box}
#map{position:fixed;inset:0;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
#map svg{width:100%;height:100%;display:block}
#world{transform-origin:0 0}
#world.anim{transition:transform .45s cubic-bezier(.3,.7,.2,1)}
@media (prefers-reduced-motion:reduce){#world.anim{transition:none}}

.ln{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.ln.tram,.ln.mono{stroke-width:6}
.walk{stroke:var(--muted);stroke-width:4;stroke-linecap:round;stroke-dasharray:.1 7;opacity:.7}
.walk.long{stroke-width:4;stroke-dasharray:.1 7;opacity:.7}
.water{fill:none;stroke:var(--shallow);stroke-width:30;stroke-linecap:round;stroke-linejoin:round}
.sea{fill:var(--sea)}
.wave{fill:none;stroke:var(--wave);stroke-width:1.2;stroke-linecap:round}
.shallow{fill:none;stroke:var(--shallow);stroke-width:46;stroke-linejoin:round}
.shallow-isl{fill:var(--shallow);stroke:var(--shallow);stroke-width:12;stroke-linejoin:round}
.land{fill:var(--bg)}
.shallow-fill{fill:var(--shallow)}
.beach{fill:none;stroke:var(--sand);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.bank{fill:none;stroke:var(--sand);stroke-width:1.2;opacity:.8}
.land.isl{stroke:var(--sand);stroke-width:1.2}
.palm-halo line,.palm-halo path{stroke:var(--shallow);stroke-linecap:round;stroke-width:20}
.palm-halo line[stroke-width="6"]{stroke-width:14}
.palm line,.palm path{stroke:var(--bg);stroke-linecap:round}
.outside{fill:var(--outside)}
.sheet-edge{fill:none;stroke:var(--rule);stroke-width:1.5}
.border{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:7 6;opacity:.45}
.district{fill:var(--district);font-size:13px;font-weight:600;letter-spacing:.22em}
.water-label{fill:var(--water-ink);font-weight:500;font-size:12px;font-style:italic;letter-spacing:.06em}
.st circle.mk{fill:var(--surface);stroke-width:3}
.st circle.ix{fill:var(--surface);stroke:var(--fg);stroke-width:3}
.st .hit{fill:transparent}
.st text{font-size:13px;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
.st.big text{font-weight:600}
.st.hid text{visibility:hidden}
.term text{font-size:10.5px;font-weight:700;letter-spacing:.01em}
.ln.susp{stroke-dasharray:3 9;opacity:.55}
.mono-note{font-size:10.5px;font-style:italic;fill:var(--muted)}
.wtag rect{fill:var(--surface);stroke:var(--rule);stroke-width:1}
.wtag text{font-size:10.5px;font-weight:600;fill:var(--muted)}
.lmk{cursor:pointer;outline:none}
.lmk circle{fill:var(--surface);stroke:var(--rule);stroke-width:1.2;filter:drop-shadow(0 1px 1.5px rgba(20,35,50,.18))}
.lmk text{font-size:12px;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;pointer-events:none}
.lmk:hover circle,.lmk:focus-visible circle{stroke:var(--accent);stroke-width:2}
.st{cursor:pointer;outline:none}
.st:hover text,.st:focus-visible text{fill:var(--accent)}
.st:focus-visible circle.mk,.st:focus-visible circle.ix{stroke:var(--accent)}
#base{transition:opacity .25s}
#base.dim{opacity:.18}
.ov text{font-weight:600}
.pin circle{stroke:var(--surface);stroke-width:3}
.pin text{fill:#fff;font-size:12px;font-weight:700;text-anchor:middle;pointer-events:none}

/* panel */
#panel{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;width:360px;max-width:calc(100% - 32px);
  background:var(--surface);border-radius:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:calc(100% - 100px);z-index:5}
.ph{padding:16px 16px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ph h1{font-family:var(--font-display);font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.ph span{color:var(--muted);font-size:12px}
.fields{padding:4px 16px 14px;display:grid;grid-template-columns:1fr 36px;gap:8px;align-items:center}
.inputs{display:flex;flex-direction:column;gap:6px;min-width:0}
.field{position:relative;display:flex;align-items:center;background:var(--bg);border-radius:10px;border:1.5px solid transparent}
.field:focus-within{border-color:var(--accent)}
.field b{flex:none;width:22px;height:22px;margin-inline-start:8px;border-radius:50%;color:#fff;font-size:11px;display:grid;place-items:center}
.field input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15px;color:var(--fg);padding:10px 8px;outline:none}
.field input::placeholder{color:var(--muted)}
.field .x{border:0;background:none;color:var(--muted);font-size:18px;padding:0 10px;cursor:pointer;line-height:1}
.field .x:focus-visible{outline:2px solid var(--accent);border-radius:6px}
button.swap{width:36px;height:36px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);color:var(--fg);cursor:pointer;font-size:16px;display:grid;place-items:center}
button.swap:hover{background:var(--accent-soft)}
button.swap:focus-visible{outline:2px solid var(--accent)}
.dd{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border-radius:12px;box-shadow:var(--shadow);z-index:20;
  max-height:280px;overflow-y:auto;list-style:none;margin:0;padding:6px}
.dd li{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px}
.dd li.on,.dd li:hover{background:var(--accent-soft)}
.dd .dots{display:flex;gap:3px;flex:none}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dd .nm{min-width:0}
.dd small{display:block;color:var(--muted);font-size:12px}
.dd .empty{color:var(--muted);cursor:default}

#result{border-top:1px solid var(--rule);overflow-y:auto;min-height:0}
#result:empty{display:none}
.hint{padding:14px 16px;color:var(--muted);line-height:1.45}
.tabs{display:flex;gap:6px;padding:12px 16px 0}
.tabs button{border:1px solid var(--rule);background:transparent;color:var(--fg);font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sum{padding:12px 16px 4px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.sum .t{font-family:var(--font-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sum .m{color:var(--muted)}
.sum .arr{width:100%;color:var(--muted);font-size:13px}
.bar{display:flex;height:6px;margin:8px 16px 4px;border-radius:3px;overflow:hidden;gap:2px}
.bar i{display:block;height:100%}
ol.steps{list-style:none;margin:0;padding:8px 16px 16px}
.leg{display:grid;grid-template-columns:18px 1fr;gap:0 12px}
.leg .rail{position:relative;display:flex;justify-content:center}
.leg .rail::before{content:"";position:absolute;top:6px;bottom:-6px;width:5px;border-radius:3px;background:var(--c)}
.leg .rail::after{content:"";position:absolute;top:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--c);box-sizing:border-box}
.leg .body{padding-bottom:14px;min-width:0}
.leg .st1{font-weight:600;font-size:15px}
.leg .dir{color:var(--muted);font-size:13px;margin-top:2px}
.leg details{margin-top:6px;font-size:13px}
.leg summary{cursor:pointer;color:var(--accent)}
.leg summary:focus-visible{outline:2px solid var(--accent);border-radius:4px}
.leg details ul{margin:6px 0 0;padding:0;list-style:none;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.xfer{display:grid;grid-template-columns:18px 1fr;gap:0 12px;color:var(--muted);font-size:13px}
.xfer .rail{display:flex;justify-content:center}
.xfer .rail::before{content:"";width:0;border-left:3px dotted var(--muted);height:100%}
.xfer .body{padding:2px 0 14px}
.end{display:grid;grid-template-columns:18px 1fr;gap:0 12px;font-weight:600;font-size:15px}
.end .rail{display:flex;justify-content:center}
.end .rail::after{content:"";width:14px;height:14px;border-radius:50%;background:var(--fg);margin-top:2px}
.status{padding:0 16px 8px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.status span{display:inline-flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.status i.off{background:var(--muted)}
.fare{margin:10px 16px 2px;padding:10px 12px;border-radius:10px;background:var(--bg);display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;font-variant-numeric:tabular-nums}
.fare b{font-size:16px}
.fare span{color:var(--muted);font-size:12.5px}
.warn{margin:8px 16px 0;padding:8px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn-fg);font-size:13px;line-height:1.4}
.near{font-size:12.5px;margin-bottom:10px;line-height:1.4}
.near span{color:var(--muted)}
details.info{padding:10px 16px 0;font-size:13px;border-top:1px solid var(--rule)}
details.info summary{cursor:pointer;font-weight:600;padding-bottom:10px}
details.info summary:focus-visible{outline:2px solid var(--accent);border-radius:4px}
details.info table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;margin-bottom:10px}
details.info th,details.info td{text-align:left;padding:4px 6px 4px 0;border-bottom:1px solid var(--rule);font-size:12.5px}
details.info th{color:var(--muted);font-weight:500}
details.info p{margin:0 0 10px;color:var(--muted);font-size:12.5px;line-height:1.45}
.dd .lm{width:9px;height:9px;border-radius:2px;background:var(--muted);transform:rotate(45deg);flex:none;margin:0 3px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .lbl{flex:none;color:var(--muted);font-size:12px;align-self:center;margin-right:2px}
.chips button{flex:none;font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.chips button:hover{background:var(--accent-soft)}
.chips button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.share{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0}
.share button,.share a{font:inherit;font-size:13px;border:1px solid var(--rule);background:var(--surface);color:var(--fg);border-radius:10px;padding:7px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.share button:hover,.share a:hover{background:var(--accent-soft)}
.share button:focus-visible,.share a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.shout{padding:8px 16px 0;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.shout input{width:100%;font:inherit;font-size:12.5px;padding:8px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--bg);color:var(--fg)}
.qr{background:#fff;padding:10px;border-radius:10px;line-height:0}
.qr img,.qr canvas{display:block;width:160px;height:160px}
ol.steps2{list-style:none;margin:0;padding:14px 16px 8px}
.step{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;padding-bottom:16px}
.step::before{content:"";position:absolute;inset-inline-start:10.5px;top:26px;bottom:2px;width:3px;border-radius:2px;background:var(--c)}
.step.onfoot::before{background:none;width:0;border-inline-start:3px dotted var(--muted);inset-inline-start:10.5px}
.step:last-child{padding-bottom:4px}
.step:last-child::before{display:none}
.step .num{width:24px;height:24px;border-radius:50%;background:var(--c);color:var(--ink);font-size:12px;font-weight:700;display:grid;place-items:center}
.step.onfoot .num{background:var(--rule);color:var(--fg)}
.step .tt{font-weight:600;font-size:15px;line-height:1.3;padding-top:2px}
.step .sub{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.4}
.step .off{margin-top:6px;font-size:14px}
.step .off b{font-weight:600}
.step details{margin-top:6px;font-size:13px}
.step summary{cursor:pointer;color:var(--accent)}
.step summary:focus-visible{outline:2px solid var(--accent);border-radius:4px}
.step details ul{margin:6px 0 0;padding:0;list-style:none;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.ph .tog{display:none;font:inherit;font-size:12.5px;border:1px solid var(--rule);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 10px;cursor:pointer}
#panel.collapsed #result{display:none}
#panel>*:not(#result){flex:none}
.phr{display:flex;align-items:center;gap:8px}
.ph{align-items:center}
.flag{width:22px;height:15px;border-radius:3px;flex:none;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.langw{position:relative}
.langbtn{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12.5px;font-weight:600;letter-spacing:.04em;border:1px solid var(--rule);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 9px 5px 6px;cursor:pointer}
.langbtn:hover{background:var(--accent-soft)}
.langbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.langbtn .chev{width:10px;height:6px;color:var(--muted)}
.langmenu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;z-index:30;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:8px;width:min(300px,calc(100vw - 48px));display:grid;grid-template-columns:1fr 1fr;gap:4px}
.langmenu .lnote{grid-column:1/-1;font-size:11.5px;color:var(--muted);padding:2px 6px 6px}
.langmenu button{display:flex;align-items:center;gap:10px;font:inherit;font-size:14px;border:0;background:transparent;color:var(--fg);border-radius:10px;padding:9px 8px;cursor:pointer;text-align:start;min-height:44px}
.langmenu button .flag{width:26px;height:17px}
.langmenu button:hover{background:var(--accent-soft)}
.langmenu button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.langmenu button[aria-checked="true"]{background:var(--accent-soft);font-weight:600}
[hidden]{display:none!important}
.tabs button .why{font-style:normal;font-size:11.5px;line-height:1.35;color:var(--accent);margin-top:1px}
.tabs button[aria-pressed="true"] .why{color:inherit;opacity:.85}
.foot button.report{font:inherit;background:transparent;border:0;padding:0;cursor:pointer}
.cbox textarea{width:100%;margin-top:10px;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--fg);background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:10px;resize:vertical}
.cbox .share{padding:10px 0 0}
.rnote{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.45}
.leave label{white-space:nowrap}
.leave{flex-wrap:wrap;row-gap:6px}
.leave select{flex:none}
.leave .reset{flex:none;margin-inline-start:auto;font:inherit;font-size:13px;font-weight:600;color:var(--accent);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:7px 12px;min-height:38px;cursor:pointer;white-space:nowrap}
.leave .reset:hover{background:var(--accent-soft)}
.leave .reset:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.foot .src{margin:6px 0 0}
.foot .report{display:inline-block;margin-top:8px;color:var(--accent);font-weight:600;text-decoration:none}
.foot .report:hover{text-decoration:underline}
.viewtabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:0 16px 10px;padding:3px;background:var(--bg);border-radius:12px}
.viewtabs button{font:inherit;font-size:13.5px;font-weight:600;border:0;border-radius:9px;padding:8px 6px;background:transparent;color:var(--muted);cursor:pointer;min-height:38px}
.viewtabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.viewtabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#panel.explore .fields,#panel.explore .leave,#panel.explore .chips{display:none}
.tours{list-style:none;margin:0;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:start;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;cursor:pointer}
.tcard:hover{background:var(--accent-soft)}
.tcard:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tcard b{font-size:15px}
.tdesc{font-size:13px;color:var(--muted);line-height:1.4}
.tmeta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:2px}
.tmeta i{font-style:normal;font-size:11.5px}
.tmeta .tag{background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 8px;font-weight:600}
.tmeta .tim{color:var(--muted)}
.tourhead{padding:12px 16px 4px}
.tourhead h2{font-size:19px;margin:8px 0 4px;text-wrap:balance}
.tourhead p{margin:0 0 6px;color:var(--muted);font-size:13.5px;line-height:1.45}
.tback{font:inherit;font-size:13px;color:var(--accent);background:transparent;border:0;padding:4px 0;cursor:pointer}
.tback:focus-visible{outline:2px solid var(--accent);border-radius:4px}
.tbackwrap{padding:10px 16px 0}
.tsum{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.tsum b{font-size:16px}
.tsum span{font-size:13px;color:var(--muted)}
.tsum .note{font-size:11.5px}
.tnote{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.4}
.tourhead .warn{margin:8px 0 0}
.tline{list-style:none;margin:0;padding:8px 16px 12px}
.tstop button{display:flex;align-items:center;gap:12px;width:100%;font:inherit;color:var(--fg);background:transparent;border:0;padding:8px 0;cursor:pointer;text-align:start;min-height:44px}

// ================= ROUTING =================
const svcById=Object.fromEntries(SVC.map(s=>[s.id,s]));
function nodesOf(st){return SVC.filter(s=>s.stops.includes(st)).map(s=>st+"@"+s.id);}
function neighbors(node){
  const [st,sid]=node.split("@");const s=svcById[sid];const out=[];
  const i=s.stops.indexOf(st);
  (s.oneway?[i+1]:[i-1,i+1]).forEach(j=>{if(j>=0&&j<s.stops.length){const nb=s.stops[j];out.push({to:nb+"@"+sid,t:segT(st,nb,s.line),k:"ride"});}});
  SVC.forEach(o=>{if(o.id!==sid&&o.stops.includes(st))out.push({to:st+"@"+o.id,t:o.line===s.line?XFER_SAME:XFER_LINE,k:"xfer"});});
  if(WALK_OF[st])nodesOf(WALK_OF[st].to).forEach(n=>out.push({to:n,t:WALK_OF[st].t,k:"walk"}));
  return out;
}
// Typical wait when boarding (minutes), from published headways. Used only for the upper end of the time range.
// Headways (minutes) by line and time of day, from the same RTA timetable; monorail from the operator.
// Red Line trains alternate between the Expo and Life Pharmacy branches, so beyond National Paints
// a given branch is served half as often.
const HEADWAY={red:{peak:3,day:4,late:9},green:{peak:6,day:10,late:10},tram:{peak:8,day:8,late:8},mono:{peak:15,day:15,late:15}};
const EXPECTED_WAIT={red:2,green:5,tram:4,mono:7.5}; // about half the daytime headway, used to compare routes
function periodAt(at){const wk=at.d>=1&&at.d<=5;const h=Math.floor(at.m/60)%24;
  if(h>=21||h<5)return "late";if(wk&&((h>=7&&h<10)||(h>=17&&h<20)))return "peak";return "day";}
function headwayFor(l,at){const line=svcById[l.svc].line;let hw=HEADWAY[line][periodAt(at)];
  if(line==="red"&&l.stops.some(x=>svcById.R1.stops.indexOf(x)>NP_I||(svcById.R2.stops.indexOf(x)>NP_I)))hw*=2;return hw;}
// Lexicographic Dijkstra over (station, service, onboard) states.
// Metrics are tracked separately:
//   time  = riding + in-station changes + walking links (minutes, estimates)
//   rides = number of boardings; transfers = rides - 1 (only a new boarding is a transfer)
//   walk  = minutes on foot between stations (never counted as a transfer)
// Each mode only chooses the order in which these metrics are compared.
const xfOf=c=>Math.max(0,c.rides-1);
// "eff" = time plus the typical wait for every boarding after the first, so a transfer is never
// treated as free when comparing routes (the displayed range still shows time and time+waits).
const CRITERIA={fast:c=>[c.eff,xfOf(c),c.walk],few:c=>[xfOf(c),c.eff,c.walk],walk:c=>[c.walk,c.eff,xfOf(c)]};
const lessThan=(a,b)=>{for(let i=0;i<a.length;i++){if(a[i]<b[i])return true;if(a[i]>b[i])return false;}return false;};
function route(a,b,mode){
  const key=CRITERIA[mode];const cost={},prev={},done=new Set();
  // state "st@svc#0" = standing at the station, able to board svc; "#1" = on board
  nodesOf(a).forEach(n=>{cost[n+"#0"]={time:0,eff:0,rides:0,walk:0};});
  while(true){
    let u=null;
    for(const n in cost)if(!done.has(n)&&(u==null||lessThan(key(cost[n]),key(cost[u]))))u=n;
    if(u==null)return null;
    const [node,ob]=u.split("#");
    if(node.split("@")[0]===b){
      // walk back, keeping the kind of every step (ride / xfer / walk)
      const steps=[{n:u,k:null}];while(prev[steps[0].n]){const p=prev[steps[0].n];steps[0].k=p.k;steps.unshift({n:p.u,k:null});}
      const nodes=[],kinds=[];
      steps.forEach(x=>{const nd=x.n.split("#")[0];if(nodes.length&&nodes[nodes.length-1]===nd)return;nodes.push(nd);kinds.push(x.k);});
      return {path:nodes,kinds,...cost[u],transfers:xfOf(cost[u])};
    }
    done.add(u);
    for(const e of neighbors(node)){
      const c={...cost[u]};let to;
      if(e.k==="ride"){c.time+=e.t;c.eff+=e.t;if(ob!=="1"){if(c.rides>0)c.eff+=EXPECTED_WAIT[svcById[node.split("@")[1]].line];c.rides+=1;}to=e.to+"#1";}
      else if(e.k==="xfer"){c.time+=e.t;c.eff+=e.t;to=e.to+"#0";}
      else{c.time+=e.t;c.eff+=e.t;c.walk+=e.t;to=e.to+"#0";}
      if(cost[to]==null||lessThan(key(c),key(cost[to]))){cost[to]=c;prev[to]={u,k:e.k};}
    }
  }
}
// The three options (fastest, fewer changes, least walking); identical routes are merged
function computeVariants(from,to){
  const variants=[];
  for(const m of ["fast","few","walk"]){
    const rt=route(from.st,to.st,m);if(!rt)continue;
    const v=summarize(rt,from,to);
    const same=variants.find(x=>x.sig===v.sig);
    if(same)same.modes.push(m);else variants.push({...v,modes:[m]});
  }
  return variants;
}
// "Why this route?": one line per option, built only from the calculated numbers and compared with the
// fastest option. Times are compared on the range shown to the user (without waiting / with typical waiting):
// a difference is stated only when both ends agree; otherwise the line says the time depends on waiting.
function timeDiff(v,f){
  const lo=v.time-f.time,hi=v.timeMax-f.timeMax;
  if(lo===0&&hi===0)return {k:"same"};
  if(lo>=0&&hi>=0)return {k:"slower",n:Math.max(1,Math.round((lo+hi)/2))};
  if(lo<=0&&hi<=0)return {k:"faster",n:Math.max(1,Math.round(-(lo+hi)/2))};
  return {k:"similar"};
}
function explainVariants(variants){
  const f=variants.find(v=>v.modes.includes("fast"))||variants[0];
  const say=d=>d.k==="slower"?t("whySlower",{n:d.n}):d.k==="faster"?t("whyFaster",{n:d.n}):d.k==="same"?t("whySameTime"):t("whySimilar");
  return variants.map(v=>{
    const parts=[];
    if(v===f){
      const others=variants.filter(x=>x!==f);
      const ds=others.map(x=>timeDiff(x,f));
      if(ds.length&&ds.every(d=>d.k==="slower"))parts.push(t("whyFaster",{n:Math.min(...ds.map(d=>d.n))}));
      else if(ds.length&&ds.every(d=>d.k==="same"))parts.push(t("whySameTime"));
      else parts.push(t("whySimilar"));
      if(f.xf===0&&others.some(x=>x.xf>0))parts.push(t("whyDirect"));
    }else{
      const dx=f.xf-v.xf,dw=f.walk-v.walk;
      if(dx>0)parts.push(v.xf===0?t("whyDirect"):t("whyFewerXf",{n:dx}));
      else if(dx<0)parts.push(t("whyMoreXf",{n:-dx}));
      if(dw>0)parts.push(t("whyLessWalk",{n:dw}));else if(dw<0)parts.push(t("whyMoreWalk",{n:-dw}));
      parts.push(say(timeDiff(v,f)));
    }
    // one sentence-like line: capital first part, lower-case continuation (no effect on scripts without case)
    return parts.map((x,i)=>i===0?x.charAt(0).toLocaleUpperCase(LANG)+x.slice(1):x.charAt(0).toLocaleLowerCase(LANG)+x.slice(1)).join(" · ");
  });
}
// Summary of one route, including walking to and from places and a waiting allowance
function summarize(rt,from=state.from,to=state.to){
  const legs=Array.isArray(rt)?toLegs(rt):toLegs(rt.path,rt.kinds);
  const rides=legs.filter(l=>l.type==="ride");
  const ride=rides.reduce((a,l)=>a+legTime(l),0);
  const changeT=legs.filter(l=>l.type!=="ride").reduce((a,l)=>a+l.t,0);
  const endWalk=(from.lm?.min||0)+(to.lm?.min||0);
  const walk=endWalk+legs.filter(l=>l.type==="walk").reduce((a,l)=>a+l.t,0);
  const time=Math.round(ride+changeT+endWalk);
  const at=dubaiAt(state.departMs||Date.now());
  const wait=rides.reduce((a,l)=>a+headwayFor(l,at),0);
  // a transfer = a new boarding after the first one; walking never counts
  return {legs,time,timeMax:Math.round(time+wait),walk,xf:Math.max(0,rides.length-1),rides:rides.length,
    stops:rides.reduce((a,l)=>a+l.stops.length-1,0),
    sig:legs.map(l=>l.type+":"+(l.svc||"")+":"+(l.stops||[l.from,l.to]).join(">")).join("|")};
}

// kinds[i] = how path[i] was reached from path[i-1] ("ride", "xfer" or "walk")
function toLegs(path,kinds){
  const legs=[];let cur=null;
  for(let i=0;i<path.length;i++){
    const [st,sid]=path[i].split("@");
    if(!cur){cur={type:"ride",svc:sid,stops:[st]};continue;}
    const [pst,psid]=path[i-1].split("@");
    const k=kinds?kinds[i]:(sid===psid&&st!==pst?"ride":(st===pst?"xfer":"walk"));
    if(k==="ride")cur.stops.push(st);
    else{
      if(cur.stops.length>1)legs.push(cur);
      const kind=k;
      if(cur.stops.length>1||kind==="walk")legs.push({type:kind,from:pst,to:st,svc:sid,fromSvc:psid,t:kind==="walk"?WALK_OF[pst].t:(svcById[sid].line===svcById[psid].line?XFER_SAME:XFER_LINE)});
      cur={type:"ride",svc:sid,stops:[st]};
    }
  }
  if(cur&&cur.stops.length>1)legs.push(cur);
  while(legs.length&&legs[0].type==="xfer")legs.shift();
  while(legs.length&&legs[legs.length-1].type==="xfer")legs.pop();
  return legs;
}
function direction(leg){
  const s=svcById[leg.svc];const i0=s.stops.indexOf(leg.stops[0]),i1=s.stops.indexOf(leg.stops[leg.stops.length-1]);
  const fwd=i1>i0;
  if(s.line==="red"){
    if(!fwd)return "Centrepoint";
    if(i1>NP_I)return leg.svc==="R1"?"Life Pharmacy":"Expo 2020";
    return t("or",{a:"Life Pharmacy",b:"Expo 2020"});

  if(s.line==="green")return fwd?"Creek":"e&";
  if(s.line==="tram")return leg.svc==="T"?"Al Sufouh":"JBR 1";

}
const legTime=l=>{let t=0;for(let i=1;i<l.stops.length;i++)t+=segT(l.stops[i-1],l.stops[i],svcById[l.svc].line);return t;};

function update(fit,noAnim){
  if(state.view==="explore"){renderExplore(fit);return;}
  drawPins();overlay.innerHTML="";base.querySelectorAll(".st.hid").forEach(n=>n.classList.remove("hid"));base.classList.remove("dim");writeHash();
  const {from,to}=state;
  $("#panel").classList.toggle("has-route",!!(from&&to));
  $("#panel").classList.toggle("empty",!from&&!to);

  const sig=(from?endToken(from):"")+">"+(to?endToken(to):"");if(sig!==lastSig){lastSig=sig;$("#panel").classList.add("peek");$("#panel").classList.remove("min");}
  fromI.placeholder=t(to&&!from?"startQ":"phFrom");

  if(!from||!to){
    hint(t(to&&!from?"startQ":(from?"hintOne":"hintNone")));

    if(from.lm&&to.lm&&from.lm!==to.lm)hint(t("hintBoth",{a:from.lm.n,b:to.lm.n,s:ST[from.st].n}));

  {if(!trkSeen.has(sig)){trkSeen.add(sig);track("route",tok(from),tok(to),trkSrc||"other",variants.length?"ok":"none");}trkSrc="";}
  if(!variants.length){hint(t("noRoute"));return;}

  renderResult(r,variants);
  base.classList.add("dim");
  const ids=new Set();
  r.legs.forEach(l=>{

      const line=svcById[l.svc].line;

    }else if(l.type==="walk"){
      el("line",{class:"walk",style:"opacity:.7",x1:ST[l.from].x,y1:ST[l.from].y,x2:ST[l.to].x,y2:ST[l.to].y},overlay);

  ids.forEach(id=>drawStation(id,ov,false));

// Turn the calculated legs into numbered, plain-language instructions
function buildSteps(r){
  const {from,to}=state;const steps=[];
  const lname=sid=>t(LINES[svcById[sid].line].key);
  const legs=r.legs.slice();
  const leadWalk=legs[0]&&legs[0].type==="walk"?legs.shift():null;
  const tailWalk=legs.length&&legs[legs.length-1].type==="walk"?legs.pop():null;
  if(from.lm){
    if(leadWalk)steps.push({walk:true,min:leadWalk.t+(from.lm.min||0),title:t("goTo",{s:ST[leadWalk.to].n}),sub:t("onFootFrom",{n:leadWalk.t+(from.lm.min||0),x:from.lm.n})});
    else steps.push({walk:true,min:from.lm.min||0,title:t("goTo",{s:ST[from.st].n}),
      sub:from.lm.note?t(from.lm.note):from.lm.min?t("fromPlace",{n:from.lm.min,p:from.lm.n,w:t(from.lm.walk)}):t("nearestTo",{p:from.lm.n})});
  }else if(leadWalk)steps.push({walk:true,min:leadWalk.t,title:t("walkTo",{s:ST[leadWalk.to].n}),sub:t("onFootFrom",{n:leadWalk.t,x:ST[leadWalk.from].n})});
  legs.forEach((l,i)=>{
    if(l.type==="ride"){
      const L=LINES[svcById[l.svc].line],n=l.stops.length-1,tm=Math.round(legTime(l));
      const first=i===0||legs[i-1].type==="walk";
      steps.push({c:L.c,ink:L.ink,min:tm,
        title:t("take",{l:t(L.key),d:direction(l)}),
        sub:(first?t("boardAt",{s:ST[l.stops[0]].n})+" · ":"")+t("stops",{n})+" · "+t("min",{n:tm}),
        off:ST[l.stops[n]].n,mid:l.stops.slice(1,-1)});
    }else if(l.type==="xfer"){
      const same=svcById[l.svc].line===svcById[l.fromSvc].line;
      steps.push({walk:true,min:l.t,title:same?t("changeTrains",{s:ST[l.from].n}):t("changeTo",{l:lname(l.svc)}),
        sub:same?t("waitPlatform",{d:l.svc==="R2"?"Expo 2020":"Life Pharmacy",n:l.t}):t("followSigns",{l:lname(l.svc),s:ST[l.from].n,n:l.t})});
    }else{
      const w=WALKS.find(w=>(w.a===l.from&&w.b===l.to)||(w.b===l.from&&w.a===l.to));
      steps.push({walk:true,min:l.t,title:t("walkTo",{s:ST[l.to].n}),sub:t(w.long?"onFootOut":"onFootSign",{n:l.t})});
    }
  });
  if(to.lm){
    if(tailWalk)steps.push({walk:true,min:tailWalk.t+(to.lm.min||0),title:t("walkToPlace",{p:to.lm.n}),sub:t("onFootFrom",{n:tailWalk.t+(to.lm.min||0),x:ST[tailWalk.from].n})});
    else steps.push({walk:true,min:to.lm.min||0,title:to.lm.note?to.lm.n:t("walkToPlace",{p:to.lm.n}),
      sub:to.lm.note?t(to.lm.note):to.lm.min?t("placeWalk",{n:to.lm.min,w:t(to.lm.walk)}):t("noWalkData")});
  }else if(tailWalk)steps.push({walk:true,min:tailWalk.t,title:t("walkTo",{s:ST[tailWalk.to].n}),sub:t("onFootFrom",{n:tailWalk.t,x:ST[tailWalk.from].n})});
  return steps;
}

    ${fare?`<div class="cfare"><span>${esc(t("estFare"))}</span><b>${fare}</b></div>`:""}

const rng=(a,b)=>a===b?t("min",{n:a}):t("minRange",{a,b});
function renderResult(r,variants){
  lastRoute=r;
  const {from,to}=state;
  const steps=buildSteps(r);
  const dep=state.departMs||Date.now();
  const fmt=m=>new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Dubai",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).format(new Date(dep+m*60000));
  const meta=v=>rng(v.time,v.timeMax)+" · "+(v.xf?t("changes",{n:v.xf}):t("noChanges"))+" · "+(v.walk?t("walking",{n:v.walk}):t("noWalking"));
  const LBL={fast:"fastest",few:"fewer",walk:"leastWalk"};
  let h=state.tourBack?`<div class="tbackwrap"><button class="tback" id="tBackRoute"><span class="barr" aria-hidden="true">←</span> ${esc(t("backTour"))}: ${esc(tourText(state.tourBack,0))}</button></div>`:"";
  const why=variants.length>1?explainVariants(variants):[];
  if(variants.length>1)h+=`<div class="tabs" role="group" aria-label="${esc(t("optLabel"))}">`+variants.map((v,i)=>
    `<button data-v="${i}" aria-pressed="${v===r}"><b>${esc(v.modes.map(m=>t(LBL[m])).join(" · "))}</b><span>${esc(meta(v))}</span><em class="why">${esc(why[i])}</em></button>`).join("")+`</div>`;
  h+=`<div class="sum"><span class="t">${esc(rng(r.time,r.timeMax))}</span><span class="m">${esc((r.xf?t("changes",{n:r.xf}):t("noChanges"))+" · "+(r.walk?t("walking",{n:r.walk}):t("noWalking"))+(r.stops?" · "+t("stops",{n:r.stops}):""))}</span>
    <span class="arr">${esc(state.departMs?t("arriveFrom",{t0:fmt(0),t1:fmt(r.time),t2:fmt(r.timeMax)}):t("arrive",{t1:fmt(r.time),t2:fmt(r.timeMax)}))}</span><span class="note">${esc(t("estNote"))}</span></div>`;
  // journey at a glance: walk, lines and changes in order
  const walkIco=WALK_ICO;
  const chipsG=[];
  if(from.lm&&from.lm.min)chipsG.push(`<span class="mw" title="${esc(t("walking",{n:from.lm.min}))}">${walkIco}${from.lm.min}</span>`);
  r.legs.forEach(l=>{
    if(l.type==="ride"){const L=LINES[svcById[l.svc].line];chipsG.push(`<span class="ml" style="--c:${L.c};--ink:${L.ink}">${esc(t(L.key))}</span>`);}
    else if(l.type==="walk")chipsG.push(`<span class="mw" title="${esc(t("walking",{n:l.t}))}">${walkIco}${l.t}</span>`);
    else if(l.type==="xfer")chipsG.push(`<span class="mx" title="${esc(t("changeAt",{s:ST[l.from].n}))}" aria-label="${esc(t("changeAt",{s:ST[l.from].n}))}">⇄</span>`);
  });
  if(to.lm&&to.lm.min)chipsG.push(`<span class="mw" title="${esc(t("walking",{n:to.lm.min}))}">${walkIco}${to.lm.min}</span>`);
  h+=`<div class="modes" aria-label="${esc(t("routeModes"))}">${chipsG.join('<i class="sep" aria-hidden="true"></i>')}</div>`;
  const peek=$("#panel").classList.contains("peek");
  h+=`<div class="morewrap"><button class="more" id="moreBtn" aria-expanded="${!peek}">${esc(t(peek?"more":"less"))} <span aria-hidden="true">${peek?"▴":"▾"}</span></button></div>`;
  const tw=r.legs.length&&r.legs[r.legs.length-1].type==="walk"?r.legs[r.legs.length-1]:null;
  if(to.lm&&tw)h+=`<div class="dest"><span class="pinb">B</span><span>${esc(t("destInfo",{p:to.lm.n,n:tw.t+(to.lm.min||0),s:ST[tw.from].n}))}</span></div>`;
  else if(to.lm&&to.lm.note)h+=`<div class="dest"><span class="pinb">B</span><span>${esc(to.lm.n+": "+t(to.lm.note))}</span></div>`;
  else if(to.lm)h+=`<div class="dest"><span class="pinb">B</span><span>${esc(to.lm.min?t("destInfo",{p:to.lm.n,n:to.lm.min,s:ST[to.st].n}):t("destInfoNo",{p:to.lm.n,s:ST[to.st].n}))}${to.lm.min?" · "+esc(t(to.lm.walk)):""}</span></div>`;
  const total=r.timeMax;
  // estimated fare
  const zs=new Set();let mono=false;
  r.legs.forEach(l=>{if(l.type!=="ride")return;if(svcById[l.svc].line==="mono"){mono=true;return;}l.stops.forEach(id=>zs.add(ZONE[id]));});
  const nz=zs.size;
  if(nz){const fi=fareIdx(nz);
    h+=`<div class="fare"><b>AED ${FARES.silver[fi]}${mono?" + "+monoFareOf(r.legs):""}</b><span>${esc(t("estFare")+" · "+t("zones",{n:nz})+(mono?" "+t("plusMono"):""))}</span><span>${esc(t("goldRed",{g:FARES.gold[fi],r:FARES.red[fi]})+(mono?" "+t("monoExtra"):""))}</span></div>`;
  }else if(mono){
    h+=`<div class="fare"><b>AED ${monoFareOf(r.legs)}</b><span>${esc(t("monoOnly"))}</span></div>`;
  }
  // service hours check
  const at0=dubaiAt(dep);const warns=[];const seen=new Set();let cum=from.lm?.min||0,closing=false;
  r.legs.forEach(l=>{
    if(l.type!=="ride"){cum+=l.t;return;}
    const k=LINES[svcById[l.svc].line].kind,lt=legTime(l);
    if(!seen.has(k)&&isSuspended(k)){seen.add(k);warns.unshift(t("monoSuspended"));}
    if(!seen.has(k)){seen.add(k);
      const at=addMin(at0,cum),st=svcState(k,at);

      // about an hour before the published closing, so any ride starting in that last hour gets the note
      else if(st.close-at.m<=LAST_TRAIN_WINDOW)closing=true;
    }
    cum+=lt;
  });
  if(closing)warns.push(t("hoursNote"));
  if(warns.length)h+=`<div class="warn" role="status">${warns.map(w=>`<p>${esc(w)}</p>`).join("")}</div>`;
  // share
  const url=shareUrl();
  const wa="https://wa.me/?text="+encodeURIComponent(t("waMsg",{a:endName(from),b:endName(to),u:url}));

  // time bar
  h+=`<div class="bar" aria-hidden="true">`+steps.filter(s=>s.min).map(s=>`<i style="flex:${s.min};background:${s.walk?"var(--rule)":s.c}"></i>`).join("")+`</div>`;
  // steps
  let k=0;
  h+=`<ol class="steps2">`+steps.map(s=>{k++;
    return `<li class="step${s.walk?" onfoot":""}" style="--c:${s.c||"var(--muted)"};--ink:${s.ink||"#fff"}"><span class="num" aria-hidden="true">${k}</span><div>
      <div class="tt">${esc(s.title)}</div><div class="sub">${esc(s.sub)}</div>`+
      (s.off?`<div class="off">${esc(t("getOff",{s:"\u0001"})).replace("\u0001","<b>"+esc(s.off)+"</b>")}</div>`:"")+
      (s.mid&&s.mid.length?`<details><summary>${esc(t("onWay"))}</summary><ul>${s.mid.map(x=>`<li>${esc(ST[x].n)}</li>`).join("")}</ul></details>`:"")+
      `</div></li>`;}).join("")+
    `<li class="step" style="--c:var(--pinB);--ink:#fff"><span class="num" aria-hidden="true">B</span><div><div class="tt">${esc(t("arriveAt",{x:endName(to)}))}</div></div></li></ol>`+footHTML();
  const wasOpen=document.getElementById("infoBox")?.open;
  res.innerHTML=h;
  $("#moreBtn").onclick=()=>{if($("#panel").classList.contains("peek"))track("view",tok(from),tok(to),"details");$("#panel").classList.toggle("peek");renderResult(r,variants);if(routeBox)fitBox(routeBox,true,1.6);};
  if(wasOpen)document.getElementById("infoBox").open=true;

const norm=s=>s.toLowerCase().replace(/[^a-z0-9&]/g,"");
const IDS=Object.keys(ST);
function matches(q){
  const n=norm(q);
  if(!n)return POPULAR.map(id=>({place:PLACE_BY_ID[id],score:0})).concat(IDS.slice().sort((a,b)=>ST[a].n.localeCompare(ST[b].n)).map(id=>({id,score:1})));
  const out=[];
  PLACES.forEach(p=>{const nn=norm(p.n);
    if(nn.startsWith(n))out.push({place:p,score:0});
    else if(nn.includes(n))out.push({place:p,score:2});
    else{const a=p.aka.find(x=>norm(x).includes(n));if(a)out.push({place:p,score:2.5,via:a});}
  });
  IDS.forEach(id=>{const s=ST[id];const nn=norm(s.n);
    if(nn.startsWith(n))out.push({id,score:0.5});
    else if(nn.includes(n))out.push({id,score:2});
    else if((ALIAS[id]||[]).some(x=>norm(x).startsWith(n)))out.push({id,score:0.6});
    else{const f=s.f.find(x=>norm(x).includes(n));if(f)out.push({id,score:3,via:f});}
  });
  return out.sort((a,b)=>a.score-b.score);
}
function combo(input,wrap,key){

    input.setAttribute("aria-expanded","true");

    close();trkSrc="search";setEnd(key,m.place?{st:m.place.st,lm:m.place}:{st:m.id});input.blur();};

    if(!ul)return;

    else if(e.key==="Enter"){e.preventDefault();choose(act);}

function computeTour(it){

    if(!A||!B){segs.push({A,B,error:true});continue;}
    if(A.st===B.st){segs.push({A,B,same:true});continue;}
    const rt=route(A.st,B.st,"fast");
    segs.push(rt?{A,B,v:summarize(rt,A,B)}:{A,B,error:true});
  }
  const ok=segs.filter(s=>s.v);
  return {ends,segs,tot:{time:ok.reduce((a,s)=>a+s.v.time,0),timeMax:ok.reduce((a,s)=>a+s.v.timeMax,0),walk:ok.reduce((a,s)=>a+s.v.walk,0),xf:ok.reduce((a,s)=>a+s.v.xf,0)}};
}

function runValidation(){

    const walkLegs=v.legs.filter(l=>l.type==="walk").reduce((x,l)=>x+l.t,0)+(A.lm?.min||0)+(B.lm?.min||0);

    if(v.xf!==xf)problems.push(`transfers expected ${xf}, got ${v.xf}`);
    if(rt.transfers!==v.xf)problems.push(`engine counted ${rt.transfers} transfers, summary ${v.xf}`);
    if(v.walk!==walkLegs)problems.push(`walking ${v.walk} ≠ walking legs ${walkLegs}`);
    if(v.xf!==Math.max(0,v.rides-1))problems.push("transfers ≠ boardings − 1");
    if(lines&&v.stops<1)problems.push("no stops on a ride route");
    if(v.time<=0&&lines)problems.push("non-positive time");
    if(problems.length){fails++;console.log(`FAIL: ${endName(A)} → ${endName(B)} [${mode}]\n  `+problems.join("\n  "));}
    rows.push({from:endName(A),to:endName(B),mode,lines:got,transfers:v.xf,walk:v.walk,stops:v.stops,time:v.time+"–"+v.timeMax,ok:!problems.length});
  });

    const A=parseToken(a),B=parseToken(b);const rt=route(A.st,B.st,"fast");const v=summarize(rt,A,B);const got=monoFareOf(v.legs);
    if(got!==want){fails++;console.log(`FAIL: monorail fare ${endName(A)} → ${endName(B)}: expected AED ${want}, got AED ${got}`);}
    rows.push({from:endName(A),to:endName(B),mode:"fare",lines:"mono",transfers:v.xf,walk:v.walk,stops:v.stops,time:"AED "+got,ok:got===want});
  });

  {const st=["palmgw","ittihad","pjm","atlantis"];const probs=[];
    st.forEach(a=>st.forEach(b=>{if(a!==b&&(monoFare(a,b)==null||monoFare(a,b)!==monoFare(b,a)))probs.push(`fare(${a},${b}) ≠ fare(${b},${a})`);}));
    if(!svcById.M||svcById.M.stops.length!==4)probs.push("monorail service definition missing");

      needModes.forEach(m=>{const i=vs.findIndex(v=>v.modes.includes(m));if(i<0||!why[i])probs.push("no explanation for "+m);});
      vs.forEach((v,i)=>{const w=why[i]||"";
        if(v!==f){
          const lo=v.time-f.time,hi=v.timeMax-f.timeMax;

          if(/\+\d+ min/.test(w)&&!(lo>=0&&hi>=0&&(lo+hi)>0))probs.push("says slower but is not: "+w);
          if(/Similar time/.test(w)&&!((lo>0&&hi<0)||(lo<0&&hi>0)))probs.push("says similar but one option is clearly better: "+w);
          if(/fewer transfer/.test(w)&&!(v.xf<f.xf))probs.push("says fewer transfers but is not: "+w);
          if(/more transfer/.test(w)&&!(v.xf>f.xf))probs.push("says more transfers but is not: "+w);
          if(/less walking/.test(w)&&!(v.walk<f.walk))probs.push("says less walking but is not: "+w);
          if(/more walking/.test(w)&&!(v.walk>f.walk))probs.push("says more walking but is not: "+w);
          if(/Same travel time/.test(w)&&!(lo===0&&hi===0))probs.push("says same time but differs: "+w);
          if(v.modes.includes("few")&&v.xf>f.xf)probs.push("fewer-changes option has more transfers");
          if(v.modes.includes("walk")&&v.walk>f.walk)probs.push("least-walking option walks more");
        }else if(/Fastest by ~(\d+)/.test(w)){
          if(!vs.filter(x=>x!==f).every(x=>x.time>=f.time&&x.timeMax>=f.timeMax))probs.push("claims 'fastest by' but another option is quicker at one end");}
      });
      if(probs.length){fails++;console.log(`FAIL: why ${endName(A)} → ${endName(B)}\n  `+probs.join("\n  "));}
      rows.push({from:endName(A),to:endName(B),mode:"why",lines:why.join(" | "),transfers:"",walk:"",stops:"",time:"",ok:!probs.length});
    });

    if(!/Red Line/.test(c.lines))probs.push("lines missing");
    if(!/#p_dxb_airport_terminal_3~p_dubai_mall~/.test(c.url))probs.push("route link missing");
    ["From: ","To: ","Route option: ","Transfers: ","Walking: ","Travel time","Language: ","Link: "].forEach(k=>{if(!txt.includes(k))probs.push("report text lacks "+k);});
    if(!REPORT_URL&&!REPORT_EMAIL&&reportTarget(c).kind!=="none")probs.push("invented a destination");
    if(probs.length){fails++;console.log("FAIL: report context\n  "+probs.join("\n  "));}
    rows.push({from:"report",to:"",mode:"report",lines:probs.length?probs.join("; "):"ok",transfers:"",walk:"",stops:"",time:"",ok:!probs.length});

    if(probs.length){tourFails++;console.log("FAIL itinerary "+it.id+": "+probs.join("; "));}
  });
  console.log(`ITINERARIES: ${ITINERARIES.length-tourFails}/${ITINERARIES.length} passed, segments ${tourOk}/${tourSegs}`);
  fails+=tourFails;
  state.from=keep.from;state.to=keep.to;
  console.table(rows);

}
